  </defs>
  <rect width="512" height="512" rx="112" fill="url(#acl-bg)"/>
  <!-- paper with folded corner -->
  <path d="M136 92h168l76 76v244a16 16 0 0 1-16 16H136a16 16 0 0 1-16-16V108a16 16 0 0 1 16-16z" fill="#FFFFFF"/>
