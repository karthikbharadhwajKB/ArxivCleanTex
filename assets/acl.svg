  <rect x="146" y="132" width="208" height="266" rx="6" fill="none" stroke="#14B8A6" stroke-width="6" stroke-dasharray="14 10"/>
  <!-- title -->
  <rect x="176" y="156" width="112" height="16" rx="8" fill="#1F2328"/>
  <!-- two text columns, as in ACL papers -->
  <g fill="#1F2328">
    <rect x="166" y="196" width="80" height="12" rx="6"/>
    <rect x="166" y="222" width="80" height="12" rx="6"/>
    <rect x="166" y="248" width="80" height="12" rx="6"/>
    <rect x="166" y="274" width="80" height="12" rx="6"/>
    <rect x="166" y="300" width="80" height="12" rx="6"/>
    <rect x="166" y="326" width="80" height="12" rx="6"/>
    <rect x="166" y="352" width="56" height="12" rx="6"/>
    <rect x="258" y="196" width="80" height="12" rx="6"/>
    <rect x="258" y="222" width="80" height="12" rx="6"/>
    <rect x="258" y="248" width="80" height="12" rx="6"/>
    <rect x="258" y="274" width="80" height="12" rx="6"/>
    <rect x="258" y="300" width="80" height="12" rx="6"/>
    <rect x="258" y="326" width="64" height="12" rx="6"/>
  </g>
  <!-- sparkles, as in the arXiv icon -->
  <path d="M404 250c6 34 18 46 52 52-34 6-46 18-52 52-6-34-18-46-52-52 34-6 46-18 52-52z" fill="#FFC53D"/>
  <path d="M96 344c4 20 11 27 31 31-20 4-27 11-31 31-4-20-11-27-31-31 20-4 27-11 31-31z" fill="#FFC53D"/>
