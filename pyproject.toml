[project]
name = "paperready"
version = "0.1.0"
description = "PaperReady: get your LaTeX paper ready for arXiv and check ACL camera-ready formatting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aclpubcheck",
    "arxiv-latex-cleaner>=1.0.11",
    "pyyaml>=6.0.3",
    "streamlit>=1.58.0",
]

[tool.uv]
package = false

[tool.uv.sources]
aclpubcheck = { git = "https://github.com/acl-org/aclpubcheck", rev = "237bee3a554f2d2fcda69cd0cf1edf4168e3d339" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
